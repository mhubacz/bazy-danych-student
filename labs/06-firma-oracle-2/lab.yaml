id: "06"
numer: "6/6"
skrot: "Firma handlowa II"
tytul: "Złączenia, grupowanie i funkcje agregujące"
cel: "JOIN, GROUP BY, COUNT, AVG i HAVING na bazie „Firma handlowa”."
silnik: oracle
baza: Firma handlowa
polaczenie: "host: localhost · port: 1521 · Service name: FREEPDB1 · użytkownik: student · hasło: student"
wstep:
  - "Docker działa, a poprzednie bazy są zatrzymane."
  - "Przejdź do katalogu laboratorium: `cd labs/06-firma-oracle-2`."
przygotowanie:
  - opis: "Uruchom bazę. To ta sama baza i ten sam wolumen co w instrukcji 5/6 — jeśli baza była już utworzona, dane i Twoje zmiany są na miejscu:"
    kod: |
      docker compose up -d
      docker compose logs -f oracle
  - uwaga: "Poczekaj na komunikat `DATABASE IS READY TO USE!` (Ctrl+C kończy podgląd logów). Reset do stanu początkowego: `docker compose down -v`, potem ponownie `docker compose up -d`."
zadania:
  - "Napisz polecenie SQL zwracające klientów i ich sprzedawców z limitem kredytowym powyżej 5000 (nazwa, adres, limit, nazwisko i imię pracownika — sprzedawcy)."
  - "Napisz polecenie SQL zwracające łączną liczbę sztuk każdego wyrobu zamówionego po 1990 roku (id, opis, liczba sztuk)."
  - "Napisz polecenie SQL zwracające nazwisko, imię i pensję pracowników, których pensja mieści się w przedziale 2000–3000."
  - "Napisz polecenie SQL zwracające zamówienia (identyfikator zamówienia, data jego złożenia, nazwa klienta) dla zamówień o wartości powyżej 200."
  - "Wyświetl nazwę klienta i wartość zamówienia złożonego przez niego, pod warunkiem że wartość zamówienia jest z przedziału <1000, 3000> i zamówienie złożono po 10 maja 1991. Posortuj wynik po wartościach zamówień."
  - "Dla zamówień spełniających warunki z poprzedniego zadania wyświetl średnią wartość zamówienia każdego klienta. Pogrupuj wiersze po nazwie klienta (`GROUP BY`); średnią liczy funkcja `AVG(total)` — użyj jej zamiast samej wartości zamówienia."
  - "Ilu pracowników zatrudnionych jest na poszczególnych etatach? Pokaż nazwę etatu (tabela `JOBS`) i liczbę pracowników. Wykonaj w dwóch krokach: najpierw nazwa etatu i `employee_id` posortowane po nazwie etatu, potem grupowanie (`GROUP BY`) i `COUNT`."
  - "Każdy klient obsługiwany jest przez pewnego pracownika. Wyświetl imię i nazwisko pracownika oraz ilu klientów obsługuje. Pracownicy, którzy nie obsługują klientów, nie powinni wystąpić w wyniku (bez złączeń zewnętrznych)."
  - "Zmodyfikuj poprzednie zadanie tak, żeby wynik pokazywał liczbę klientów w poszczególnych miastach (imię i nazwisko, miasto, liczba klientów)."
  - "Napisz polecenie SQL zwracające wydziały (`DEPARTMENT`), które mają więcej niż 3 pracowników."
uwaga_silnik: "`JOIN`, `GROUP BY`, `HAVING`, `COUNT` i `AVG` działają standardowo. Imię i nazwisko łączysz operatorem `||`. Zadania 1–4 powtarzają materiał z 5/6 — to celowa powtórka przed grupowaniem."
