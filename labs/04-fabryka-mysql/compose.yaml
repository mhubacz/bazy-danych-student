# Laboratorium 4/6 — baza „Fabryka” na MySQL.
# Skrypty z katalogu init/ wykonują się AUTOMATYCZNIE przy pierwszym starcie (pusty wolumen).
# Reset do stanu początkowego:  docker compose down -v && docker compose up -d --wait
name: lab04-fabryka

services:
  mysql:
    image: mysql:8.4
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: student
      MYSQL_DATABASE: fabryka
      MYSQL_USER: student
      MYSQL_PASSWORD: student
    ports: ["3306:3306"]
    volumes:
      - mysql-data:/var/lib/mysql
      - ./init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # test przez TCP: tymczasowy serwer z fazy inicjalizacji działa z --skip-networking
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -pstudent --silent"]
      interval: 5s
      timeout: 3s
      retries: 30

volumes:
  mysql-data:
