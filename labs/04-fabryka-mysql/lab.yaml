id: "04"
numer: "4/6"
skrot: "Fabryka"
tytul: "INSERT, UPDATE, DELETE — baza „Fabryka”"
cel: "Modyfikacja danych poleceniami INSERT, UPDATE i DELETE oraz zapytania z warunkami i prostymi złączeniami."
silnik: mysql
baza: Fabryka
polaczenie: "host: localhost · port: 3306 · baza: fabryka · użytkownik: student · hasło: student"
wstep:
  - "Docker działa, a poprzednie bazy są zatrzymane (`docker compose down` w ich katalogach)."
  - "Przejdź do katalogu laboratorium: `cd labs/04-fabryka-mysql`."
przygotowanie:
  - opis: "Uruchom bazę. Tabele (`hale`, `maszyny`, `operatorzy`, `operator_maszyna`, `awarie`) wczytują się same ze skryptu `init/01_fabryka.sql`:"
    kod: |
      docker compose up -d --wait
  - uwaga: "Połącz się w DBeaver (dane powyżej). Jeśli DBeaver zgłosi „Public Key Retrieval is not allowed”, w ustawieniach połączenia (*Edit Connection* → *Driver properties*) ustaw `allowPublicKeyRetrieval` na `true`. W tym laboratorium modyfikujesz dane, więc reset do stanu początkowego jest przydatny: `docker compose down -v`, a potem `docker compose up -d --wait`."
zadania:
  - "Dodaj nowego operatora o Twoim imieniu i nazwisku, przy czym przełożonym będzie BOND. Reszta danych wg uznania."
  - "Dodaj nową maszynę „Pakowarka próżniowa” do Magazynu A."
  - "Tokarka zaczęła zgrzytać. Wprowadź informację o tej awarii."
  - "Podwyższ o 20% płace operatorów, którzy nie mają przełożonego."
  - "BRUCE WILLIS dostał uprawnienia obsługi wózka widłowego i obsługuje wózki wraz z BONDem. Wprowadź odpowiednie informacje do bazy."
  - "Napisz polecenie SQL zwracające nazwiska i płace operatorów, którzy zarabiają więcej niż 1000, a mniej niż 2000."
  - "Napisz polecenie SQL zwracające maszyny, których jeszcze nie uruchomiono."
  - "Napisz polecenie SQL zwracające nazwiska i płace operatorów, którzy mają przełożonych."
  - "Napisz polecenie SQL zwracające maszyny uruchomione między rokiem 2010 a 2012."
  - "Napisz polecenie SQL zwracające maszyny ze wszystkich hal poza halą nr 1."
  - "Napisz polecenie SQL zwracające daty wszystkich awarii oraz nazwy maszyn, które im uległy."
  - "Napisz polecenie zwracające maszyny wraz z imionami i nazwiskami operatorów, którzy je obsługują."
  - "Napisz polecenie SQL zwracające nazwy maszyn oraz nazwy hal, w których te maszyny się znajdują."
uwaga_silnik: "Klucze `id_maszyny` i `id_operatora` mają `AUTO_INCREMENT` — w zadaniach 1–2 nie podawaj ich ręcznie. Datę zapisujesz jako `'2010-01-01'`. W zadaniu 3 skorzystaj z `CURDATE()` jako daty awarii. Uwaga: w MySQL operator `||` oznacza OR, a nie łączenie tekstu."
