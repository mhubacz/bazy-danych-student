id: "02"
numer: "2/6"
skrot: "Docker Compose"
tytul: "Wiele silników i Docker Compose"
cel: "Uruchomić trzy silniki jednym poleceniem, poznać wolumeny i porównać różnice w składni SQL."
silnik: all
polaczenie: "host: localhost · użytkownik: student · hasło: student · baza: student · porty: PostgreSQL 5432, MySQL 3306, Oracle 1521 (Service name: FREEPDB1) · Adminer: http://localhost:8080"
wstep:
  - "Zakończ instrukcję 1/6 (usuń jej kontenery: `docker rm -f pg-lab mysql-lab oracle-lab`)."
  - "Przejdź do katalogu laboratorium: `cd labs/02-docker-compose`."
przygotowanie:
  - opis: "Przeczytaj plik `compose.yaml` z tego katalogu. Opisuje on cztery usługi — trzy bazy i klienta Adminer:"
    plik: "02-docker-compose/compose.yaml"
  - opis: "Uruchom cały zestaw i sprawdź stan (opcja `--wait` czeka, aż bazy będą gotowe):"
    kod: |
      docker compose up -d --wait
      docker compose ps
zadania:
  - "Wskaż w pliku `compose.yaml`, gdzie podano obrazy, porty, zmienne środowiskowe i wolumeny."
  - "Otwórz `http://localhost:8080` (Adminer) i połącz się z PostgreSQL (serwer `postgres`) oraz MySQL (serwer `mysql`). Użytkownik i hasło: `student`. Do Oracle użyj DBeaver."
  - "W każdym z trzech silników utwórz tę samą tabelę z kluczem automatycznym i porównaj składnię (`IDENTITY` / `SERIAL` / `AUTO_INCREMENT`)."
  - "Wykonaj w każdym silniku zapytanie łączące imię i nazwisko w jedną kolumnę i filtrujące po dacie. Zapisz, gdzie składnia się różni (`||` vs `CONCAT`, zapis daty)."
  - "Zatrzymaj zestaw poleceniem `docker compose down`, uruchom go ponownie (`docker compose up -d --wait`) i sprawdź, czy Twoje tabele nadal istnieją. Dlaczego dane przetrwały?"
  - "Usuń zestaw razem z danymi: `docker compose down -v`. Co się stało z tabelami po ponownym uruchomieniu?"
uwaga_silnik: "Jeśli `up` zgłasza zajęty port 5432/3306/1521, zatrzymaj lub usuń kontenery, które go zajmują (`docker ps`, `docker stop nazwa` lub `docker rm -f nazwa`). Oracle przy pierwszym starcie potrzebuje kilku minut — `--wait` poczeka na niego. Pamiętaj, że każde z laboratoriów 3–7 używa tych samych portów, więc przed ich uruchomieniem wykonaj `docker compose down`."
